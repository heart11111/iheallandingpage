<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIOLAB 근거 차트 — 원본 ↔ HTML (검토·승인용)</title>
<style>
  :root{--bg:#eef2f6;--card:#fff;--ink:#0f172a;--muted:#475569;--grid:#e2e8f0;--brand:#0b5f78;--brand2:#0d9488;--placebo:#94a3b8;--accent:#1e40af;--purple:#6b21a8;--pill:#0f766e;--plot:#f8fafc;--axis:#334155;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Noto Sans JP",Arial,sans-serif}
  header{position:sticky;top:0;z-index:10;background:#0f2233;color:#fff;padding:12px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  header h1{font-size:15px;margin:0;font-weight:700}
  header .sub{font-size:11px;color:#9fb3c8}
  .controls{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid #33506b;border-radius:8px;overflow:hidden}
  .seg button{background:#16324a;color:#cfe0ee;border:0;padding:5px 12px;font-size:12px;cursor:pointer}
  .seg button.on{background:#2f9e97;color:#fff;font-weight:700}
  .controls label{font-size:11px;color:#9fb3c8;display:flex;gap:6px;align-items:center}
  .wrap{max-width:1680px;margin:0 auto;padding:18px}
  .note{font-size:13px;color:#374151;background:#fff;border:1px solid var(--grid);border-left:4px solid var(--brand2);padding:12px 14px;border-radius:8px;margin-bottom:18px;line-height:1.6}
  .legendbar{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:6px 0 16px}
  .legendbar span{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--grid);padding:3px 9px;border-radius:20px}
  .dotb{width:10px;height:10px;border-radius:50%}
  .dotb.lg{width:22px;height:22px;border:2px solid rgba(0,0,0,.08);box-shadow:inset 0 0 0 2px #fff}
  h2.prod{font-size:16px;margin:26px 0 10px;color:#0f2233;border-bottom:2px solid #c5ced8;padding-bottom:8px;font-weight:800}
  .ba{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(200px,260px) 56px;gap:14px;background:#fff;border:1px solid var(--grid);border-radius:12px;padding:14px 14px 14px 52px;margin:12px 0;box-shadow:0 1px 4px rgba(16,34,51,.07);align-items:stretch}
  .chart-id{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:8px;background:#0f2233;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;box-shadow:0 2px 6px rgba(15,34,51,.22);z-index:2;flex-shrink:0}
  .ba.ba-crit .chart-id{background:#b91c1c}
  .ba.ba-exact{border-color:#86efac;background:linear-gradient(90deg,#fff 0%,#fff 88%,#ecfdf5 100%)}
  .ba.ba-approx{border-color:#fcd34d;background:linear-gradient(90deg,#fff 0%,#fff 88%,#fffbeb 100%)}
  .ba.ba-crit{border-color:#fca5a5;box-shadow:0 0 0 1px rgba(185,28,28,.12)}
  @media(max-width:1100px){.ba{grid-template-columns:1fr 1fr;}.fix-rail,.mark-rail{grid-column:1/-1}}
  @media(max-width:720px){.ba{grid-template-columns:1fr;padding-left:12px;padding-top:40px;}.chart-id{top:8px;transform:none;}.mark-rail{min-height:56px;padding-top:4px}}
  .fix-rail{background:#fff5f5;border:1px solid #fecaca;border-left:4px solid #dc2626;border-radius:8px;padding:10px 11px;min-width:0;align-self:stretch}
  .fix-rail .fh{font-size:11px;font-weight:800;color:#b91c1c;letter-spacing:.02em;margin:0 0 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .fix-rail .sev{font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px;color:#fff}
  .fix-rail .sev.critical{background:#b91c1c}
  .fix-rail .sev.major{background:#dc2626}
  .fix-rail .sev.minor{background:#f97316}
  .fix-rail .sev.ok{background:#059669}
  .fix-rail .sev.na{background:#94a3b8}
  .fix-rail .sec{font-size:10px;font-weight:800;color:#991b1b;margin:8px 0 3px}
  .fix-rail ul{margin:0;padding-left:16px;color:#991b1b;font-size:11px;line-height:1.45}
  .fix-rail li{margin:2px 0}
  .fix-rail .okmsg{font-size:11px;color:#047857;font-weight:600;line-height:1.45}
  .fix-rail .namsg{font-size:11px;color:#64748b;line-height:1.45}
  .side{min-width:0}
  .side .h{font-size:12px;font-weight:800;letter-spacing:.3px;color:#374151;text-transform:uppercase;margin-bottom:8px;display:flex;gap:8px;align-items:center}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff}
  .b-chart{background:#12857e}.b-done{background:#1f9d55}.b-image{background:#556}.b-exact{background:#059669}.b-approx{background:#d97706}
  .mark-rail{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:4px 0}
  .mark-circle{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;line-height:1;box-shadow:0 2px 8px rgba(15,34,51,.18);border:3px solid #fff;flex-shrink:0}
  .mark-circle.exact{background:#059669}
  .mark-circle.approx{background:#d97706}
  .mark-circle.none{background:#cbd5e1;color:#475569;font-size:18px}
  .mark-label{font-size:10px;font-weight:800;letter-spacing:.02em;text-align:center;line-height:1.25;max-width:58px}
  .mark-label.exact{color:#047857}
  .mark-label.approx{color:#b45309}
  .mark-label.none{color:#64748b}
  .side img{width:100%;display:block;border:1px solid #e5e7eb;border-radius:6px;background:#fafafa}
  .fname{font-size:10px;color:#9aa3af;margin-top:4px;font-family:monospace}
  .after-box{border:1px solid #e2e8f0;border-radius:10px;padding:14px;min-height:260px;height:100%;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(180deg,#fff 0%,var(--plot) 100%);box-shadow:inset 0 0 0 1px rgba(15,34,51,.03)}
  .pillt{display:inline-block;background:var(--pill);color:#fff;font-weight:800;font-size:13px;padding:6px 14px;border-radius:20px;margin-bottom:6px;align-self:flex-start}
  .cap{font-size:12.5px;color:#1f2937;margin-top:8px;line-height:1.55;font-weight:600}
  .pend{font-size:12px;color:#8a6d3b;background:#fff8ec;border:1px solid #f0e0c0;border-radius:8px;padding:12px;text-align:center;line-height:1.6}
  .legc{display:flex;gap:16px;font-size:13px;margin:4px 0 8px;flex-wrap:wrap;font-weight:700;color:#111827}
  .legc i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid rgba(0,0,0,.12)}
  svg{width:100%;height:auto;display:block;overflow:visible;min-height:200px}
  .barRect{transform-box:fill-box;transform:scaleY(1)}
  .lp{transition:none}
  .dot{opacity:1}
  text{font-family:inherit}
  .after-box svg text{paint-order:stroke fill;stroke:rgba(255,255,255,.85);stroke-width:.6px}
</style>
</head>

<header>
  <div><h1>원본 이미지 ↔ HTML 재현 — 비포/애프터 (검토·승인용)</h1>
    <div class="sub">원본↔HTML 비교 · Exact 교차검증 반영(2026-08-21) · 라이브 제품 차트는 미반영</div></div>
  <div class="controls">

  </div>
</header>
<div class="wrap" id="stage">

  <div class="legendbar">

    <span style="border-color:#fecaca;color:#991b1b"><i class="dotb lg" style="background:#dc2626"></i>빨간 패널 = 비전 차이·수정안 (이번 라운드 다수 반영)</span>
    <span><i class="dotb lg" style="background:#0f2233"></i>왼쪽 <b>#번호</b> = 지적용 차트 ID (예: 「#7 오차바」)</span>
  </div>
</div>

function legendMED(){const d=document.createElement("div");d.className="legc";d.innerHTML='<span><i style="background:var(--accent)"></i>'+L(T.MED)+'</span><span><i style="background:var(--placebo)"></i>'+L(T.placebo)+'</span>';return d;}
function legendMED01(){const d=document.createElement("div");d.className="legc";d.innerHTML='<span><i style="background:var(--purple)"></i>'+L(T.MED01)+'</span><span><i style="background:var(--placebo)"></i>'+L(T.placebo)+'</span>';return d;}
function legendNVP(){const d=document.createElement("div");d.className="legc";d.innerHTML='<span><i style="background:var(--brand2)"></i>'+L(T.NVP)+'</span><span><i style="background:#9aa3af"></i>'+L(T.placebo)+'</span>';return d;}
function legendCustom(items){const d=document.createElement("div");d.className="legc";d.innerHTML=items.map(it=>'<span><i style="background:'+it.c+'"></i>'+(typeof it.t==='string'?it.t:L(it.t))+'</span>').join('');return d;}
function markRail(kind){
  const k=kind||"none",copy=MARK_COPY[k]||MARK_COPY.none;
  const rail=document.createElement("div");rail.className="mark-rail";rail.title=L(copy).replace(/\n/g," ");
  const cir=document.createElement("div");cir.className="mark-circle "+k;cir.textContent=copy.glyph;
  const lab=document.createElement("div");lab.className="mark-label "+k;lab.innerHTML=L(copy).replace(/\n/g,"<br>");
  rail.appendChild(cir);rail.appendChild(lab);return rail;
}
function fixRail(buildKey,type,num){
  const rail=document.createElement("div");rail.className="fix-rail";
  const idTag=num?'<span style="margin-left:auto;font-weight:800;color:#0f2233;font-size:12px">#'+num+'</span>':'';
  if(type==="image"||!buildKey){
    rail.innerHTML='<div class="fh"><span class="sev na">n/a</span>비전 수정안'+idTag+'</div><div class="namsg">이미지 유지 · 차트 재현 대상 아님</div>';
    return rail;
  }
  const fx=FIXES[buildKey];
  if(!fx){
    rail.innerHTML='<div class="fh"><span class="sev na">?</span>비전 수정안'+idTag+'</div><div class="namsg">이 키에 대한 비전 기록 없음 — 재감사 필요</div>';
    return rail;
  }
  const sev=fx.sev||"major";
  const sevLab={critical:"치명",major:"중요",minor:"경미",ok:"양호"}[sev]||sev;
  let html='<div class="fh"><span class="sev '+sev+'">'+sevLab+'</span>비전 차이 · 수정안'+(fx.applied?' <span class="sev ok">적용</span>':'')+idTag+'</div>';
  if(sev==="ok"&&(!fx.diffs||!fx.diffs.length)){
    html+='<div class="okmsg">원본과 시각적으로 충분. 미세 정돈만 선택.</div>';
  } else {
    if(fx.diffs&&fx.diffs.length){
      html+='<div class="sec">차이점</div><ul>'+fx.diffs.map(function(d){return '<li>'+d+'</li>';}).join('')+'</ul>';
    }
    if(fx.fixes&&fx.fixes.length){
      html+='<div class="sec">수정안</div><ul>'+fx.fixes.map(function(d){return '<li>'+d+'</li>';}).join('')+'</ul>';
    }
  }
  rail.innerHTML=html;return rail;
}
function render(){
  document.getElementById("topnote").innerHTML=L(T.headnote);
  [...stage.querySelectorAll(".prod,.ba")].forEach(n=>n.remove());
  let chartSeq=0;
  INV.forEach(function(entry){const prod=entry[0],items=entry[1];
    const h=document.createElement("h2");h.className="prod";h.textContent=prod;stage.appendChild(h);
    items.forEach(function(it){chartSeq+=1;const num=chartSeq;const file=it[0],type=it[1],buildKey=it[2],desc=it[3];
      const markKind=buildKey&&MARK[buildKey]?MARK[buildKey]:"none";
      const fx=buildKey&&FIXES[buildKey];
      const ba=document.createElement("div");ba.className="ba"+(markKind==="exact"?" ba-exact":markKind==="approx"?" ba-approx":"")+(fx&&fx.sev==="critical"?" ba-crit":"");ba.id="chart-"+num;
      const cid=document.createElement("div");cid.className="chart-id";cid.textContent=num;cid.title="#"+num+" · "+file;ba.appendChild(cid);
      const bf=document.createElement("div");bf.className="side";
      bf.innerHTML='<div class="h">BEFORE · <b>#'+num+'</b> · 원본 <span class="badge '+(type==='image'?'b-image':'b-chart')+'">'+(type==='image'?'도식·사진':'차트')+'</span></div>';
      const SRC=file.indexOf('local:')===0?file.slice(6):IMG+file;
      const fn=document.createElement("div");fn.className="fname";fn.innerHTML='<a href="'+SRC+'" target="_blank" rel="noreferrer" style="color:#9aa3af">'+file+'</a>';
      const im=document.createElement("img");im.loading="eager";im.decoding="async";im.referrerPolicy="no-referrer";
      im.onerror=function(){this.style.display="none";const w=document.createElement("div");w.className="pend";w.innerHTML='이 뷰어에서 원본을 못 불러왔어요 →<br><a href="'+SRC+'" target="_blank" rel="noreferrer">브라우저에서 원본 열기</a>';bf.insertBefore(w,fn);};
      im.src=SRC;bf.appendChild(im);bf.appendChild(fn);
      const af=document.createElement("div");af.className="side";
      if(buildKey&&BUILD[buildKey]){const b=BUILD[buildKey];
        const statusBadge=markKind==="exact"?'<span class="badge b-exact">Exact 반영</span>':markKind==="approx"?'<span class="badge b-approx">Approx 반영</span>':'<span class="badge b-done">완성</span>';
        af.innerHTML='<div class="h">AFTER · <b>#'+num+'</b> · HTML '+statusBadge+'</div>';
        const box=document.createElement("div");box.className="after-box";
        const pill=document.createElement("div");pill.className="pillt";pill.textContent=L(b.pill);box.appendChild(pill);
        if(!b.noLegend)box.appendChild(b.legendItems?legendCustom(b.legendItems):b.legend==="med"?legendMED():b.legend==="med01"?legendMED01():b.legend==="nvp"?legendNVP():null);
        box.appendChild(b.render());
        const cp=document.createElement("div");cp.className="cap";cp.textContent=L(b.cap);if(b.cap)box.appendChild(cp);
        af.appendChild(box);
      } else {
        af.innerHTML='<div class="h">AFTER · <b>#'+num+'</b> <span class="badge b-image">이미지 유지</span></div><div class="pend">'+L(desc)+'<br><small>데이터 차트가 아니라 그대로 둡니다</small></div>';
      }
      ba.appendChild(bf);ba.appendChild(af);ba.appendChild(fixRail(buildKey,type,num));ba.appendChild(markRail(markKind));stage.appendChild(ba);
    });
  });
  observe();
}
function observe(){document.querySelectorAll(".after-box").forEach(function(c){c.classList.add("show");});}
document.getElementById("lang").addEventListener("click",function(e){const b=e.target.closest("button");if(!b)return;[...e.currentTarget.children].forEach(function(x){x.classList.remove("on");});b.classList.add("on");LANG=b.dataset.l;document.documentElement.lang=LANG;render();});
const wctl=document.getElementById("w"),wv=document.getElementById("wv");wctl.addEventListener("input",function(){stage.style.maxWidth=wctl.value+"px";wv.textContent=Math.round(wctl.value/1680*100)+"%";});
render();
</script>
