name: Deploy BIOLAB Japan landing page

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biolab-japan-science-landing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: biolab-japan-science-landing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build static export
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"
          # Set a repo variable named CUSTOM_DOMAIN to build for a root-served
          # custom domain. Leave it unset to keep the /iheallandingpage project build.
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      - name: Add nojekyll marker
        run: New-Item -ItemType File -Force -Path out/.nojekyll
        shell: pwsh
      - name: Add CNAME for custom domain
        if: vars.CUSTOM_DOMAIN != ''
        run: Set-Content -Path out/CNAME -Value "${{ vars.CUSTOM_DOMAIN }}" -NoNewline
        shell: pwsh
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./biolab-japan-science-landing/out
          publish_branch: gh-pages
